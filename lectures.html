<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A4G Labs Lectures</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="AI for Good Lab, Korea National Open University">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Merriweather:wght@700;900&display=swap">
<style>
/* Layout: the planet on the night side, quiet lists under it, no boxes. Copper is the lab's accent, as on the Rescene-ESM page. */
:root {
  --abyss: #050b14; --fg: #edf2f5; --muted: #9fb0be; --line: rgba(165, 195, 220, .2); --grid: rgba(165, 195, 220, .1);
  --copper: #e09a5f; --warm: #ff8250; --cool: #5fcbea; --quiet: #7f93a5;
  --display: "Merriweather", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--abyss); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--abyss); color: var(--fg); font: 400 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 3px; }
a:hover { color: var(--copper); text-decoration-color: currentColor; }
a:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
.wrap { max-width: 1080px; margin-inline: auto; display: grid; gap: clamp(40px, 6vw, 72px); }
header { max-width: 1080px; margin-inline: auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 24px; padding-block: 20px clamp(28px, 4vw, 44px); }
.brand { font: 900 18px/1.2 var(--display); text-decoration: none; }
nav { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 14.5px; }
nav a { text-decoration: none; color: var(--muted); padding-block: 4px; }
nav a[aria-current] { color: var(--fg); box-shadow: 0 1px 0 var(--copper); }
h1 { font: 900 clamp(30px, 4vw, 48px)/1.08 var(--display); letter-spacing: -.01em; text-wrap: balance; }
h2 { font: 500 12px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--copper); margin-bottom: 14px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 16px; align-items: center; }
.hero h1 { font-size: clamp(46px, 7vw, 88px); }
.hero p { color: var(--muted); font-size: clamp(16px, 1.5vw, 19px); margin-top: 14px; }
.globe { display: block; position: relative; text-decoration: none; }
.globe img { display: block; width: 100%; height: auto; aspect-ratio: 1; transition: transform .5s ease;
  -webkit-mask-image: radial-gradient(closest-side, #000 90%, transparent 100%); mask-image: radial-gradient(closest-side, #000 90%, transparent 100%); }
.globe:hover img { transform: scale(1.02); }
.globe span { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); white-space: nowrap; font: 500 13px/1 var(--mono); color: var(--fg); }
@media (prefers-reduced-motion: reduce) { .globe img { transition: none; } .globe:hover img { transform: none; } }
.two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px clamp(32px, 6vw, 72px); }
.rows > li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); }
.rows .mono { font-size: 13px; line-height: 1.75; color: var(--muted); }
.topic { padding-block: 10px; border-top: 1px solid var(--line); }
.topic b { display: block; font-weight: 600; }
.topic span { color: var(--muted); font-size: 14.5px; }

/* models */
.chart { display: grid; gap: 2px; position: relative; padding-bottom: 26px; --name: 112px; }
.bar-row { display: grid; grid-template-columns: var(--name) minmax(0, 1fr); align-items: center; min-height: 30px; font-size: 13.5px; }
.bar-row a { text-decoration: none; }
.bar-track { position: relative; height: 8px; }
.bar { position: absolute; top: 0; height: 8px; border-radius: 4px; background: var(--c); min-width: 8px; }
.grid-lines { position: absolute; left: var(--name); right: 0; top: 0; bottom: 26px; pointer-events: none; }
.grid-lines i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--grid); }
.axis { position: absolute; left: var(--name); right: 0; bottom: 0; height: 22px; border-top: 1px solid var(--line); }
.axis span { position: absolute; top: 6px; font: 400 11px/1 var(--mono); color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
.axis span:last-child { transform: translateX(-100%); }
.f-weather { --c: var(--cool); } .f-hazard { --c: var(--warm); } .f-tools { --c: var(--quiet); }
.model { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 124px); gap: 6px 24px; padding-block: 16px; border-top: 1px solid var(--line); align-items: baseline; scroll-margin-top: 16px; }
.model h3 { font: 700 18px/1.25 var(--display); }
.model .what { color: var(--muted); font-size: 14px; display: block; margin-top: 2px; }
.model .big { display: block; font: 500 20px/1.25 var(--mono); font-variant-numeric: tabular-nums; }
.model .cap { color: var(--muted); font-size: 14px; display: block; margin-top: 2px; }
.links { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 14px; justify-content: flex-end; }
.links a { color: var(--copper); }
.groups { display: grid; gap: 40px; }

/* publications, members, lectures */
.pub { padding-block: 14px; border-top: 1px solid var(--line); }
.pub a { font-weight: 500; }
.pub p { color: var(--muted); font-size: 14.5px; margin-top: 3px; }
.who h1 small { font: 400 .55em/1 var(--body); color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.who > p { color: var(--muted); margin-top: 10px; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px clamp(24px, 4vw, 48px); }
.plain > li { padding-block: 8px; border-top: 1px solid var(--line); font-size: 15px; }
.plain .mono { display: block; font-size: 12.5px; color: var(--muted); }
.stack { display: grid; gap: clamp(32px, 4vw, 48px); }
@media (max-width: 760px) {
  .hero, .two, .cols { grid-template-columns: minmax(0, 1fr); }
  .model { grid-template-columns: minmax(0, 1fr); }
  .links { justify-content: flex-start; }
  .chart { --name: 92px; } .bar-row { font-size: 12.5px; }
  .axis span.opt { display: none; }
}
</style>
</head>

<main class="wrap"><section><h1>Lectures</h1></section><section><ul class="plain"><li><span class="mono">2026 Spring</span>Advanced C programming (Undergraduate)</li></ul></section></main>

</html>
