<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A4G Labs Lectures</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="AI for Good Lab, Korea National Open University">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Merriweather:wght@700;900&display=swap">
<style>
/* Layout: a white page of quiet lists with hairlines, the planet as the only picture. Navy for links and copper for small
   labels, as on the lab's Google Site. */
:root {
  --bg: #ffffff; --ink: #1b1f24; --muted: #5f6872; --line: #e7eaee;
  --navy: #182a69; --copper: #b4532a;
  --display: "Merriweather", Georgia, "Times New Roman", serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 3px; }
a:hover { color: var(--navy); text-decoration-color: currentColor; }
a:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
.wrap { max-width: 1040px; margin-inline: auto; display: grid; gap: clamp(40px, 6vw, 64px); }
header { max-width: 1040px; margin-inline: auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 24px; padding-block: 22px clamp(28px, 4vw, 48px); }
.brand { font: 900 18px/1.2 var(--display); text-decoration: none; }
nav { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 14.5px; }
nav a { text-decoration: none; color: var(--muted); padding-block: 4px; }
nav a[aria-current] { color: var(--ink); box-shadow: 0 1.5px 0 var(--navy); }
h1 { font: 900 clamp(30px, 4vw, 46px)/1.08 var(--display); letter-spacing: -.01em; text-wrap: balance; }
h2 { font: 500 12px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--copper); margin-bottom: 4px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 24px; align-items: center; }
.hero h1 { font-size: clamp(46px, 7vw, 84px); }
.hero p { color: var(--muted); font-size: clamp(16px, 1.5vw, 19px); margin-top: 14px; }
.globe { display: grid; justify-items: center; gap: 14px; text-decoration: none; }
.globe img { display: block; width: min(100%, 520px); height: auto; aspect-ratio: 1; filter: drop-shadow(0 22px 40px rgba(24, 42, 105, .18)); transition: transform .5s ease; }
.globe:hover img { transform: scale(1.02); }
.globe span { font: 500 13.5px/1 var(--mono); color: var(--navy); }
@media (prefers-reduced-motion: reduce) { .globe img { transition: none; } .globe:hover img { transform: none; } }
.two { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px clamp(32px, 6vw, 72px); }
.rows > li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; padding-block: 11px; border-top: 1px solid var(--line); }
.rows .mono { font-size: 13px; line-height: 1.75; color: var(--muted); }
.topic { padding-block: 11px; border-top: 1px solid var(--line); }
.topic b { display: block; font-weight: 600; }
.topic span { color: var(--muted); font-size: 14.5px; }

/* models: a two-column list, one short entry per model */
.groups { display: grid; gap: 44px; }
.mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 clamp(32px, 5vw, 64px); margin-top: 10px; }
.model { display: grid; gap: 4px; align-content: start; padding-block: 16px 20px; border-top: 1px solid var(--line); scroll-margin-top: 16px; }
.model h3 { font: 700 19px/1.25 var(--display); }
.model .what { color: var(--muted); font-size: 14.5px; }
.model .stat { font-size: 14px; color: var(--muted); margin-top: 6px; }
.model .stat b { font: 500 15px/1.3 var(--mono); color: var(--ink); margin-right: 8px; font-variant-numeric: tabular-nums; }
.links { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 14px; margin-top: 6px; }
.links a { color: var(--navy); }

/* publications, members, lectures */
.pub { padding-block: 14px; border-top: 1px solid var(--line); }
.pub a { font-weight: 500; }
.pub p { color: var(--muted); font-size: 14.5px; margin-top: 3px; }
.who h1 small { font: 400 .55em/1 var(--body); color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.who > p { color: var(--muted); margin-top: 10px; }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px clamp(24px, 4vw, 48px); }
.plain > li { padding-block: 9px; border-top: 1px solid var(--line); font-size: 15px; }
.plain .mono { display: block; font-size: 12.5px; color: var(--muted); }
h2 + .plain, h2 + .rows, h2 + ul { margin-top: 10px; }
@media (max-width: 760px) {
  .hero, .two, .cols, .mgrid { grid-template-columns: minmax(0, 1fr); }
  .hero { gap: 8px; }
}
</style>
</head>

<header><a class="brand" href="index.html">A4G Labs</a><nav aria-label="Pages"><a href="models.html">Models</a><a href="publications.html">Publications</a><a href="members.html">Members</a><a href="lectures.html" aria-current=page>Lectures</a></nav></header>
<main class="wrap"><section><h1>Lectures</h1></section><section><ul class="plain"><li><span class="mono">2026 Spring</span>Advanced C programming (Undergraduate)</li></ul></section></main>
</body>
</html>
